ui-sdk-checkbox = { path = "crates/components/checkbox" }
ui-sdk-collapsible = { path = "crates/components/collapsible" }
ui-sdk-color = { path = "crates/foundation/color" }
ui-sdk-color-picker = { path = "crates/components/color-picker" }
ui-sdk-combobox = { path = "crates/components/combobox" }
