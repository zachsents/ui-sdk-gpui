[workspace]
resolver = "2"
members = ["crates/kernel", "crates/native", "crates/page", "crates/gallery", "crates/sink", "crates/ui-sdk", "crates/foundation/*", "crates/components/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/zachsents/ui-sdk-gpui"
rust-version = "1.98"

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "2f808b3c2de049ecfdbad0fdb26763cebfcaa3b4" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "2f808b3c2de049ecfdbad0fdb26763cebfcaa3b4", features = ["font-kit"] }
log = "0.4"
reqwest_client = { git = "https://github.com/zed-industries/zed.git", rev = "2f808b3c2de049ecfdbad0fdb26763cebfcaa3b4" }
ui-sdk = { path = "crates/ui-sdk" }
ui-sdk-accordion = { path = "crates/components/accordion" }
ui-sdk-autocomplete = { path = "crates/components/autocomplete" }
ui-sdk-avatar = { path = "crates/components/avatar" }
ui-sdk-button = { path = "crates/components/button" }
ui-sdk-calendar = { path = "crates/components/calendar" }
ui-sdk-canvas = { path = "crates/foundation/canvas" }
