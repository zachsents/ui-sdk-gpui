[package]
name = "ui-sdk-input"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
gpui.workspace = true
log.workspace = true
ui-sdk-kernel.workspace = true
ui-sdk-forms.workspace = true
ui-sdk-native.workspace = true
ui-sdk-platform.workspace = true
# A native input's `pattern`, which the browser checks with its own engine.
regex = "1.13"
# `type="url"`: a valid absolute URL, as the WHATWG parser browsers use reads it.
url = "2.5"

[dev-dependencies]
gpui_platform.workspace = true
